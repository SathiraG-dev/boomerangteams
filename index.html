<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boomerang Teams — Coming Soon</title>
<meta name="description" content="Boomerang Teams is coming soon." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <div class="logo">
      <span class="logo-arrow">↩</span>
      <span class="logo-text">Boomerang Teams</span>
    </div>

    <h1>We're coming back around.</h1>
    <p class="subtitle">Something new is on its way. Leave your email and we'll let you know the moment we launch.</p>

    <form class="notify-form" id="notify-form">
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      <button type="submit">Notify me</button>
    </form>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

    <footer>
      <p>&copy; <span id="year"></span> Boomerang Teams. All rights reserved.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
